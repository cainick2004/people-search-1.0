<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#172033">
  <meta name="description" content="仅在本机保存人物资料的轻量级人物搜索与登记工具">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>People Search</title>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-icon">PS</div>
      <div><h1>People Search</h1><p>人物信息搜索与登记</p></div>
    </div>
    <span class="local-badge">仅本机保存</span>
  </header>

  <main>
    <section class="summary">
      <div class="stat"><strong id="totalCount">0</strong><span>人物总数</span></div>
      <div class="stat"><strong id="photoCount">0</strong><span>已有头像</span></div>
    </section>

    <nav class="tabs" aria-label="主导航">
      <button class="tab active" data-tab="search">搜索</button>
      <button class="tab" data-tab="add">新增人物</button>
      <button class="tab" data-tab="list">人物列表</button>
    </nav>

    <section id="searchPanel" class="panel">
      <h2>搜索已登记人物</h2>
      <label class="searchbox"><span>⌕</span><input id="searchInput" type="search" placeholder="姓名、公司、城市或行业"></label>
      <p class="hint">搜索范围为本机已登记档案。需要查找互联网上的公开资料时，可使用下面的网络搜索。</p>
      <button id="webSearchBtn" class="secondary full">用网络搜索此姓名</button>
      <div id="searchResults" class="people-list"></div>
    </section>

    <section id="addPanel" class="panel hidden">
      <h2 id="formTitle">新增人物</h2>
      <form id="personForm">
        <input type="hidden" id="personId">
        <div class="photo-editor">
          <div id="photoPreview" class="avatar avatar-large">?</div>
          <label class="upload-button" for="photoInput">上传人物照片</label>
          <input id="photoInput" type="file" accept="image/*" capture="environment">
          <button id="removePhotoBtn" type="button" class="text-button hidden">移除头像</button>
          <p class="hint">照片会压缩后保存在本机浏览器，不会上传到网站服务器。</p>
        </div>

        <label>姓名 <em>*</em><input id="name" required maxlength="100" placeholder="人物姓名"></label>
        <label>所在城市<input id="city" maxlength="100" placeholder="例如：Firenze"></label>
        <label>职位<input id="position" maxlength="120" placeholder="例如：CEO / Manager"></label>
        <label>所属公司<input id="company" maxlength="160" placeholder="公司名称"></label>
        <label>所属行业<input id="industry" maxlength="120" placeholder="例如：科技、餐饮、房地产"></label>
        <label>人物背景及备注<textarea id="notes" rows="4" maxlength="3000" placeholder="职业背景、公开信息或个人备注"></textarea></label>
        <label>信息来源<input id="source" type="url" maxlength="1000" placeholder="https://..."></label>
        <button class="primary full" type="submit">保存人物档案</button>
        <button id="cancelEditBtn" class="secondary full hidden" type="button">取消编辑</button>
      </form>
    </section>

    <section id="listPanel" class="panel hidden">
      <div class="section-heading"><h2>人物档案列表</h2><span id="listCount" class="muted"></span></div>
      <label class="searchbox"><span>⌕</span><input id="listSearchInput" type="search" placeholder="筛选人物"></label>
      <div id="allPeople" class="people-list"></div>
      <div class="data-actions">
        <button id="exportBtn" class="secondary">导出备份</button>
        <label class="secondary import-label" for="importInput">导入备份</label>
        <input id="importInput" type="file" accept="application/json">
      </div>
      <p class="hint">备份文件包含人物资料和头像。请妥善保管，避免发送给无关人员。</p>
    </section>
  </main>

  <footer>People Search · PWA · 数据保存在此 iPhone 的浏览器中</footer>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="./app.js"></script>
</body>
</html>
